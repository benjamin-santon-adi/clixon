# Enable Clixon library with full POSIX support
CONFIG_CLIXON=y
CONFIG_CLIXON_DEBUG=y

# Enable Clixon service for demonstration
CONFIG_CLIXON_SERVICE=y
CONFIG_CLIXON_LOG_LEVEL_INF=y

# POSIX support required by Clixon (selected automatically)
# CONFIG_POSIX_API=y is selected by CLIXON

# File system support (LittleFS) - selected automatically
# CONFIG_FILE_SYSTEM=y
# CONFIG_FILE_SYSTEM_LITTLEFS=y

# Increase heap for file operations
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Increase stack size for clixon operations
CONFIG_MAIN_STACK_SIZE=8192

# Console and logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# Increase stack size for clixon operations
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Enable networking if needed
# CONFIG_NETWORKING=y
# CONFIG_NET_IPV4=y
# CONFIG_NET_TCP=y
