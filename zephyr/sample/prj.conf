# Enable Clixon service for demonstration
# NOTE: Full Clixon library (CONFIG_CLIXON=y) not yet required
# The service provides minimal NETCONF functionality
CONFIG_CLIXON_SERVICE=y

# Enable NETCONF support
CONFIG_CLIXON_NETCONF=y

# Enable NETCONF over TLS
CONFIG_CLIXON_NETCONF_TLS=y
CONFIG_CLIXON_NETCONF_PORT=830

# TLS requires a larger mbedTLS heap for certificate parsing and crypto operations
CONFIG_MBEDTLS_HEAP_SIZE=32768

# Clixon Datastore Support
CONFIG_CLIXON_DATASTORE=y
CONFIG_CLIXON_DATASTORE_LITTLEFS=y
CONFIG_CLIXON_XMLDB_DIR="/lfs/clixon"
CONFIG_CLIXON_XMLDB_FORMAT="xml"

# POSIX support required by Clixon service
CONFIG_POSIX_API=y

# Networking stack (required by NETCONF)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=n

# Memory configuration (increased for networking and TLS)
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_BUF_DATA_SIZE=512

# Console and logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# mbedTLS debug logging  
CONFIG_MBEDTLS_DEBUG=n
