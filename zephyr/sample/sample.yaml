sample:
  name: Clixon Basic Sample
  description: Basic sample demonstrating Clixon library usage with Zephyr RTOS
common:
  tags:
    - clixon
    - netconf
    - yang
    - configuration
  platform_allow:
    - qemu_x86
    - native_sim
    - native_posix
    - eval_adin6310t1lebz/max32690/m4
  # Note: STM32 boards (e.g., nucleo_f767zi) are not supported due to
  # enum name conflict between STM32 HAL and Clixon library (SET enum)
  # See STM32_LIMITATION.md for details
  integration_platforms:
    - qemu_x86
    - native_sims
tests:
  sample.lib.clixon.basic:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Clixon Sample Application"
        - "Initializing Clixon"
        - "Clixon initialization complete"
