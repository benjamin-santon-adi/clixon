# LittleFS configuration for Clixon datastore
# Uses internal flash partition for configuration storage

# Enable filesystem support
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Flash storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# LittleFS settings (Zephyr 4.3.1 has limited Kconfig options)
# Most LittleFS parameters are configured in devicetree fstab
CONFIG_FS_LITTLEFS_NUM_FILES=8
CONFIG_FS_LITTLEFS_NUM_DIRS=8
