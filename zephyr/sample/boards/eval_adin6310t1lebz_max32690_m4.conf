# Board-specific configuration for eval_adin6310t1lebz/max32690/m4

# Include LittleFS configuration for Clixon datastore
# The overlay file defines the flash partition

# Filesystem support
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Flash storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# LittleFS settings optimized for MAX32690
CONFIG_FS_LITTLEFS_NUM_FILES=8
CONFIG_FS_LITTLEFS_NUM_DIRS=8

# Increase heap for TLS operations and filesystem (192KB)
CONFIG_HEAP_MEM_POOL_SIZE=196608

# Network configuration
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Ethernet configuration
CONFIG_NET_L2_ETHERNET=y

# Increase network buffers for NETCONF
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Increase system workqueue stack for network processing
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
