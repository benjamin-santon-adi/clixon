# Clixon NETCONF TLS Test Configuration

# Enable Clixon library and service
CONFIG_CLIXON=y
CONFIG_CLIXON_SERVICE=y
CONFIG_CLIXON_LOG_LEVEL_INF=y

# Enable NETCONF with TLS
CONFIG_CLIXON_NETCONF=y
CONFIG_CLIXON_NETCONF_TLS=y
CONFIG_CLIXON_NETCONF_PORT=830

# Networking stack
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# Network configuration for testing
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

# Increase buffers for TLS
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

# Memory configuration
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# POSIX (selected by Clixon automatically)
# CONFIG_POSIX_API=y

# Test-specific settings
CONFIG_TEST=y
